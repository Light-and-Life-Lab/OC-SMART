name: Package release archives

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build_archives:
    name: Build release archives
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: lfs-v2-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: GIT_TRACE=1 GIT_TRANSFER_TRACE=1 git lfs pull -v

      - name: Verify LFS files resolved
        run: |
          for f in auxdata/common/GOCI_auxdata.h5 auxdata/common/no2_climatology_v2013.hdf auxdata/common/ozone_climatology_v2014.hdf; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "ERROR: $f is only $size bytes, the LFS pointer probably did not resolve correctly"
              exit 1
            fi
          done

      - name: Package release archives
        run: |
          VERSION="${{ github.ref_name }}"
          OUTDIR="OC-SMART-${VERSION}"
          mkdir -p "/tmp/$OUTDIR"
          rsync -a --exclude='.git' ./ "/tmp/$OUTDIR/"
          (cd /tmp && zip -r "$OLDPWD/OC-SMART-${VERSION}.zip" "$OUTDIR")
          (cd /tmp && tar -czf "$OLDPWD/OC-SMART-${VERSION}.tar.gz" "$OUTDIR")

      - name: Upload archives to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OC-SMART-*.zip
            OC-SMART-*.tar.gz
          generate_release_notes: true